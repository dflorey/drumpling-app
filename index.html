<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Drumpling FS-5: a vintage-style drum machine from the FS family." />
    <meta name="theme-color" content="#24211d" />
    <title>Drumpling FS-5</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff2a14'/%3E%3C/svg%3E" />
    <!-- Installable app: manifest for Android/Chrome, meta tags and touch icon for iOS home screens -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Drumpling" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <script>
      // On its own (not embedded in another page) the page gets a solid backdrop; embedded, it
      // stays transparent so the host page shows around the device.
      if (window.self === window.top) document.documentElement.classList.add('solo');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        /* Keep clear of notches, rounded corners and the home indicator. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: transparent;
      }
      /* Phones in portrait and short screens (phones held sideways): every pixel of height counts. */
      @media (max-width: 720px) and (orientation: portrait) {
        body {
          padding-top: max(6px, env(safe-area-inset-top));
          padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
      }
      /* Small screens: the device nearly full width */
      @media (max-width: 720px) {
        body {
          padding-left: max(4px, env(safe-area-inset-left));
          padding-right: max(4px, env(safe-area-inset-right));
        }
      }
      @media (max-height: 520px) {
        body {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
      }
      /*
       * Installed as an app there is no host page behind it, so give it a dark backdrop. The app
       * scales itself to fit the window, so the page never needs to scroll: no scrollbars at all.
       */
      @media (display-mode: standalone) {
        html {
          background: #24211d;
          overflow: hidden;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /* Phones and landscape windows scroll instead of scaling the device down (see fit()) */
      @media (display-mode: standalone) and (max-width: 720px), (display-mode: standalone) and (orientation: landscape) {
        html {
          overflow: auto;
        }
      }
      /*
       * On its own page the device sits on a solid warm charcoal, a little lighter than the panel
       * so the case's drop shadow still reads, and matching the theme colour.
       */
      html.solo {
        min-height: 100%;
        background: #24211d;
      }
      drumpling-app:not(:defined) {
        display: none;
      }
    </style>

      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #c6ffd2, #3ef06a 55%, #129c3a);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(62, 240, 106, 0.55);
    }

    /*
     * Under the display, on two lines at every width: Start / Stop, Intro / End and the two fills
     * (a group), Half time and Click, a little room between the groups, the keys as wide as six equal
     * columns; below them the tempo group (the tempo display, a wide Tap, Swing and Sloppy, a grid
     * of its own over the first five columns: Tap and the knobs as wide as they are, the display
     * the rest) and Volume under Click. The names on the line below each.
     */
    /*
     * A column of the control row: its inner width (the panel's less its padding) less the groups'
     * three 0.3rem spacers and eight gaps, over six. The effects use it too, so Reverb lines up
     * under Volume.
     */
    .controls,
    .effects {
      --col: calc((100cqw - 2 * var(--pad-x) - 0.9rem - 8 * 0.4rem) / 6);
    }
    .controls {
      --row-h: 56px;
      --knob-size: var(--knob);
      --digit-size: 2.1rem;
      --display-padding: 0.45rem 0.9rem;
      --display-reserve: 3.6rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 0.3rem repeat(3, minmax(0, 1fr)) 0.3rem minmax(0, 1fr) 0.3rem minmax(0, 1fr);
      grid-template-rows: var(--row-h) auto var(--row-h) auto;
      grid-template-areas:
        'start . intro f1 f2 . half . click'
        'start-l . intro-l f1-l f2-l . half-l . click-l'
        'group group group group group group group . volume'
        'group group group group group group group . volume-l';
      justify-items: center;
      gap: 0.75rem 0.4rem;
      padding: 1.7rem 2.4rem 1.4rem;
    }
    .controls .key {
      align-self: stretch;
      justify-self: stretch;
      width: auto;
    }
    .tempo-group {
      display: grid;
      grid-area: group;
      justify-self: stretch;
      /*
       * Swing and Sloppy close to Volume: each in a column as wide as its knob and name
       * (--knob-col, at most a key column), Sloppy's ending where Half time's does, the space
       * between them as far as Sloppy is from Volume (half a key column less half a knob column,
       * plus the 0.3rem spacer before Volume's), so Swing, Sloppy and Volume stand evenly apart
       */
      --knob-col: min(var(--col), calc(var(--knob) + 1rem));
      grid-template-columns:
        minmax(0, 1fr) auto var(--knob-col) calc(var(--col) / 2 - var(--knob-col) / 2 + 0.3rem)
        var(--knob-col);
      grid-template-rows: var(--row-h) auto;
      grid-template-areas:
        'tempo tap swing . sloppy'
        'tempo-l tap-l swing-l . sloppy-l';
      justify-items: center;
      gap: inherit;
    }
    /* Tap wide, an easy target for tapping; held upright as wide as Start / Stop, a key column */
    .controls .tempo-group .key {
      justify-self: center;
      width: 72px;
    }
    @media (orientation: portrait) {
      .controls .tempo-group .key.tap {
        width: var(--col);
      }
    }
    .start {
      grid-area: start;
      width: 58px;
    }
    .fill {
      width: 44px;
    }
    .intro {
      grid-area: intro;
    }
    .intro-l {
      grid-area: intro-l;
    }
    .f1 {
      grid-area: f1;
    }
    .f2 {
      grid-area: f2;
    }
    .half {
      grid-area: half;
      width: 50px;
    }
    /*
     * The display's frame is drawn 5px outside its box, a key's outline 2px: 6px shorter than the
     * row, its outer edges line up with the Tap key's
     */
    .controls value-display {
      grid-area: tempo;
      justify-self: stretch;
      align-self: center;
      height: calc(var(--row-h) - 6px);
      /* Its frame is drawn outside its box: as much room to Tap as Half time has to the frame */
      margin-right: 8px;
      --segment-on: #f2a51c;
      --segment-off: rgba(242, 165, 28, 0.07);
      --segment-glow: rgba(242, 150, 20, 0.7);
      --glass-center: #33210a;
      --glass-mid: #170f04;
      --glass-edge: #0c0702;
      /* Just the number: the label says it is the tempo */
      --unit-display: none;
      --display-reserve: 1.8rem;
    }
    /* The metronome click, on or off */
    .click {
      grid-area: click;
      width: 46px;
    }
    .click-l {
      grid-area: click-l;
    }
    /* Tap in the grey of the Metronome FS-1's */
    .tap {
      grid-area: tap;
      width: 46px;
      --cap-top: #bdbab2;
      --cap-mid: #a19e96;
      --cap-low: #858279;
    }
    .controls .swing {
      grid-area: swing;
      align-self: center;
    }
    .controls .sloppy {
      grid-area: sloppy;
      align-self: center;
    }
    .controls .volume {
      grid-area: volume;
      align-self: center;
    }
    .start-l {
      grid-area: start-l;
      color: #e0533d;
    }
    .f1-l {
      grid-area: f1-l;
    }
    .f2-l {
      grid-area: f2-l;
    }
    .half-l {
      grid-area: half-l;
    }
    .tempo-l {
      grid-area: tempo-l;
    }
    .tap-l {
      grid-area: tap-l;
    }
    .swing-l {
      grid-area: swing-l;
      width: calc(var(--knob) + 1rem);
    }
    .sloppy-l {
      grid-area: sloppy-l;
      width: calc(var(--knob) + 1rem);
    }
    .volume-l {
      grid-area: volume-l;
      width: calc(var(--knob) + 1rem);
    }

    /*
     * The effects, on a plate of their own: flat paint, as the TR-808's panel, in a muted blue,
     * with rounded corners. Punch and Gated switch on and off, Scratch and Stutter act while held; the
     * knobs on the right, Reverb under Volume (the plate's margin and padding add up to the control
     * row's padding).
     */
    .effects {
      --fx-h: 52px;
      --knob-size: var(--knob);
      display: grid;
      /* Reverb's column as wide as the control row's last, so it sits under Volume */
      grid-template-columns: auto auto auto auto minmax(0.5rem, 1fr) auto auto auto var(--col);
      grid-template-rows: var(--fx-h) auto;
      grid-template-areas:
        'punch gated scratch stutter . comp filter delay reverb'
        'punch-l gated-l scratch-l stutter-l . comp-l filter-l delay-l reverb-l';
      justify-items: center;
      gap: 0.6rem 1rem;
      margin: 0.2rem 1.6rem 1rem;
      padding: 1rem 0.8rem 0.9rem;
      border-radius: 6px;
      background: #4c5d6e;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .fx-key {
      width: 56px;
      height: var(--fx-h);
    }
    .effects value-knob {
      align-self: center;
    }
    .stutter {
      grid-area: stutter;
    }
    .punch {
      grid-area: punch;
    }
    .gated {
      grid-area: gated;
    }
    .scratch {
      grid-area: scratch;
    }
    .comp {
      grid-area: comp;
    }
    .filter {
      grid-area: filter;
    }
    .delay {
      grid-area: delay;
    }
    .reverb {
      grid-area: reverb;
    }
    .stutter-l {
      grid-area: stutter-l;
    }
    .punch-l {
      grid-area: punch-l;
    }
    .gated-l {
      grid-area: gated-l;
    }
    .scratch-l {
      grid-area: scratch-l;
    }
    .comp-l,
    .filter-l,
    .delay-l,
    .reverb-l {
      width: calc(var(--knob) + 1rem);
    }
    .comp-l {
      grid-area: comp-l;
    }
    .filter-l {
      grid-area: filter-l;
    }
    .delay-l {
      grid-area: delay-l;
    }
    .reverb-l {
      grid-area: reverb-l;
    }

    /*
     * The machine row, as the Vibralizer's recordings row: its name above, then the slider and the
     * readout with the machine's name (narrow: the slider has the room)
     */
    .machines {
      --transport-key: 40px;
      display: grid;
      grid-template-columns: minmax(110px, 2.75fr) minmax(185px, 1fr);
      grid-template-areas:
        'title title'
        'slider readout';
      align-items: center;
      gap: 0.45rem 1.2rem;
      padding: 1.1rem 2.4rem 0.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .machines .title,
    .complexity .title {
      margin-bottom: 0.5rem;
    }
    .machines .title {
      grid-area: title;
      justify-self: start;
    }
    .machines step-slider {
      grid-area: slider;
      /* Its slot level with the readout's middle */
      transform: translateY(-8px);
    }
    .readout {
      grid-area: readout;
      display: flex;
      align-items: center;
      min-width: 0;
      height: var(--transport-key);
      padding: 0 0.9rem;
      box-sizing: border-box;
      font: 700 1rem/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffb347;
      text-shadow: 0 0 6px rgba(255, 150, 50, 0.65);
      border-radius: 3px;
      background: #0a0b0a;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.95),
        0 0 0 2px #141412,
        0 0 0 3px #050505,
        0 1px 0 3px rgba(255, 255, 255, 0.08);
    }
    .readout span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* Complexity: a slider with the level's name beside it, above the style keys */
    .complexity {
      display: grid;
      grid-template-columns: minmax(110px, 2.75fr) minmax(185px, 1fr);
      grid-template-areas:
        'title title'
        'slider readout';
      align-items: center;
      gap: 0.45rem 1.2rem;
      padding: 0.7rem 2.4rem 0.3rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
    }
    .complexity .title {
      grid-area: title;
      justify-self: start;
    }
    .complexity step-slider {
      grid-area: slider;
      transform: translateY(-8px);
    }
    .complexity .readout {
      --transport-key: 40px;
    }

    /* The style keys, each with its name under it (narrow panels: two rows of four) */
    .styles {
      display: grid;
      grid-template-columns: repeat(${q.length}, minmax(0, 1fr));
      gap: 0.9rem 1.2rem;
      padding: 1.1rem 2.4rem 1.5rem;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    .style-cell {
      display: grid;
      gap: 0.6rem;
      min-width: 0;
    }
    .style {
      height: 60px;
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    kbd {
      font: inherit;
      font-weight: 700;
      padding: 0 0.3em;
      border: 1px solid rgba(232, 225, 204, 0.35);
      border-radius: 3px;
    }

    /* Phones and short screens: thinner cheeks, less padding, smaller keys */
    @media (max-width: 720px), (orientation: landscape) and (max-height: 520px) {
      .cheek {
        flex-basis: 12px;
      }
      header {
        padding: 0.9rem 2.2rem 0.75rem 1.6rem;
      }
      .display-section {
        padding: calc(1.25rem + 5px) calc(1rem + 5px) 5px;
      }
      .controls,
      .machines,
      .complexity,
      .styles {
        padding-left: 1rem;
        padding-right: 1rem;
      }
      /* Margin and padding make the control row's 1rem, so Reverb stays under Volume */
      .effects {
        margin-left: 0.4rem;
        margin-right: 0.4rem;
        padding-left: 0.6rem;
        padding-right: 0.6rem;
      }
      .controls {
        --row-h: 50px;
        padding-top: 1.25rem;
        padding-bottom: 1.1rem;
      }
      .controls-panel {
        --knob: 48px;
        --pad-x: 1rem;
      }
      .styles {
        column-gap: 0.4rem;
      }
      .style {
        height: 50px;
      }
      .label {
        font-size: 0.56rem;
        letter-spacing: 0.06em;
      }
      footer {
        padding: 0;
        height: 26px;
      }
      .hints {
        display: none;
      }
    }

    /* Middle widths and down: the effects' keys over their knobs, in two rows of four */
    @container controls (max-width: ${Pt}px) {
      /* In columns as wide as the control row's, spread evenly, the last flush right, so Reverb sits under Volume */
      .effects {
        grid-template-columns: repeat(4, var(--col));
        justify-content: space-between;
        grid-template-rows: var(--fx-h) auto var(--knob) auto;
        grid-template-areas:
          'punch gated scratch stutter'
          'punch-l gated-l scratch-l stutter-l'
          'comp filter delay reverb'
          'comp-l filter-l delay-l reverb-l';
        gap: 0.4rem 0;
      }
      /* The keys as wide as their columns */
      .effects .fx-key {
        width: auto;
        justify-self: stretch;
      }
    }

    @container controls (max-width: ${Ot}px) {
      /* The tempo group slimmer, so the display keeps room for its digits */
      .controls .tempo-group .key {
        width: 56px;
      }
      .controls .swing-l,
      .controls .sloppy-l {
        width: calc(var(--knob) + 0.3rem);
      }
      .controls {
        --row-h: 44px;
        --digit-size: 1.5rem;
        --display-padding: 0.25rem 0.4rem;
        --display-reserve: 0.8rem;
        --unit-display: none;
      }
      .effects {
        --fx-h: 44px;
      }
      .fx-key {
        width: 48px;
      }
      .controls-panel,
      .controls,
      .effects,
      .machines {
        --knob: 40px;
      }
      .tap {
        width: 46px;
      }
      .start {
        width: 50px;
      }
      .fill {
        width: 40px;
      }
      .half {
        width: 46px;
      }
      .key .key-led {
        top: 6px;
      }
      .cap-number {
        bottom: 5px;
        font-size: 0.7rem;
      }
      .machines {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          'title'
          'slider'
          'readout';
      }
      .machines step-slider,
      .complexity step-slider {
        transform: none;
      }
      .readout {
        padding: 0 0.6rem;
        font-size: 0.82rem;
        letter-spacing: 0.03em;
      }
      .complexity {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          'title'
          'slider'
          'readout';
      }
      .style {
        height: 44px;
      }
      .styles {
        grid-template-columns: repeat(${Math.ceil(q.length/2)}, minmax(0, 1fr));
        row-gap: 0.7rem;
      }
      .style-cell {
        gap: 0.4rem;
      }
    }

    /*
     * Phones held sideways: the display on the left at full height, the controls beside it, as on
     * the Vibralizer FS-4.
     */
    @media (orientation: landscape) and (max-height: 520px) {
      :host {
        --min-display: 150px;
      }
      .panels {
        display: grid;
        flex: 1;
        min-height: 0;
        grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      }
      .display-section {
        padding: calc(0.8rem + 5px) calc(0.8rem + 5px) calc(0.8rem + 5px) calc(0.8rem + 15px);
        border-right: 1px solid rgba(0, 0, 0, 0.65);
        box-shadow: 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      .controls-panel {
        justify-content: center;
      }
      header {
        --brand-size: 1.25rem;
        padding: 0.4rem 2.2rem 0.35rem 1.6rem;
      }
      .controls {
        --row-h: 40px;
        row-gap: 0.3rem;
        padding-top: 0.7rem;
        padding-bottom: 0.5rem;
      }
      .effects,
      .machines,
      .complexity {
        padding-top: 0.6rem;
        padding-bottom: 0.4rem;
        row-gap: 0.3rem;
      }
      .effects {
        --fx-h: 40px;
      }
      .styles {
        padding-top: 0.5rem;
        padding-bottom: 0.6rem;
      }
      .style {
        height: 40px;
      }
      footer {
        height: 16px;
      }
    }

    /*
     * Landscape: the device as wide as the window, the display on the left at full height and the
     * controls beside it (short screens tighten this further below)
     */
    @media (orientation: landscape) {
      :host {
        width: 100%;
      }
      .panels {
        display: grid;
        flex: 1;
        min-height: 0;
        /* The controls never narrower than a phone's (unless that is over half) */
        grid-template-columns: minmax(0, 1.1fr) minmax(min(360px, 50%), 1fr);
      }
      .display-section {
        border-right: 1px solid rgba(0, 0, 0, 0.65);
        box-shadow: 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      .controls-panel {
        justify-content: center;
      }
    }
    @media (orientation: landscape) and (min-height: 521px) {
      .display-section {
        padding-bottom: calc(1.4rem + 5px);
      }
    }

    /*
     * Phones in portrait: every gap tightened so the device fits the screen without scrolling; no
     * readouts under the sliders (the LCD names the machine), the slider names beside the sliders
     */
    @media (max-width: 720px) and (orientation: portrait),
      (orientation: landscape) and (max-height: 960px) {
      :host {
        --min-display: 130px;
      }
      header {
        padding-top: 0.6rem;
        padding-bottom: 0.5rem;
      }
      .display-section {
        padding-top: calc(0.7rem + 5px);
      }
      .controls {
        row-gap: 0.3rem;
        padding-top: 0.75rem;
        padding-bottom: 0.5rem;
      }
      /* Machine and complexity side by side, the rest full width */
      .controls-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        align-content: start;
      }
      .controls,
      .effects,
      .styles {
        grid-column: 1 / -1;
      }
      .effects {
        --fx-h: 40px;
        row-gap: 0.3rem;
        margin-top: 0;
        margin-bottom: 0.5rem;
        padding-top: 0.5rem;
        padding-bottom: 0.45rem;
      }
      .machines .readout,
      .complexity .readout {
        display: none;
      }
      .machines,
      .complexity {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          'title'
          'slider';
        row-gap: 0.2rem;
        padding-top: 0.5rem;
        padding-bottom: 0.4rem;
      }
      .machines {
        padding-right: 0.6rem;
      }
      .complexity {
        padding-left: 0.6rem;
        border-left: 1px solid rgba(0, 0, 0, 0.65);
      }
      .machines .title,
      .complexity .title {
        margin-bottom: 0;
      }
      .machines step-slider,
      .complexity step-slider {
        transform: none;
      }
      .styles {
        padding-top: 0.5rem;
        padding-bottom: 0.6rem;
        row-gap: 0.45rem;
      }
      .style-cell {
        gap: 0.3rem;
      }
      .style {
        height: 38px;
      }
      footer {
        height: 16px;
      }
    }
    /* Landscape: the controls centred beside the display */
    @media (orientation: landscape) and (min-height: 521px) {
      .controls-panel {
        align-content: center;
      }
    }
    /* A narrow controls column: the names under the top keys unspaced, so Start/Stop and Intro/End never touch */
    @container controls (max-width: 480px) {
      .controls .label {
        letter-spacing: 0;
      }
    }
    /* A very narrow controls column: the key names closer together, so they never touch */
    @container controls (max-width: 380px) {
      .label {
        font-size: 0.5rem;
        letter-spacing: 0.02em;
      }
      /* Start/Stop and Intro/End break after the slash, rather than run into their neighbours */
      .start-l,
      .intro-l {
        white-space: normal;
        line-height: 1.15;
      }
    }
    /* Phones in portrait: names a little larger, and a little more room between the rows */
    @media (max-width: 720px) and (orientation: portrait) {
      .label {
        font-size: 0.6rem;
        letter-spacing: 0.03em;
      }
      .controls {
        row-gap: 0.4rem;
      }
      .effects {
        row-gap: 0.35rem;
      }
      .machines,
      .complexity {
        padding-top: 0.6rem;
        padding-bottom: 0.45rem;
      }
      .styles {
        padding-top: 0.6rem;
        padding-bottom: 0.75rem;
        row-gap: 0.55rem;
      }
      .style-cell {
        gap: 0.4rem;
      }
      footer {
        height: 18px;
      }
    }
    /* Short phones: smaller keys and knobs still */
    @media (max-width: 720px) and (orientation: portrait) and (max-height: 700px) {
      :host {
        --min-display: 125px;
      }
      .controls {
        --row-h: 36px;
      }
      .controls-panel {
        --knob: 36px;
      }
      .effects {
        --fx-h: 30px;
        --knob: 28px;
        row-gap: 0.15rem;
        margin-bottom: 0.35rem;
        padding-top: 0.4rem;
        padding-bottom: 0.35rem;
      }
      .styles {
        padding-top: 0.4rem;
        padding-bottom: 0.4rem;
        row-gap: 0.3rem;
      }
      .style {
        height: 30px;
      }
      .key .key-led {
        top: 5px;
      }
      footer {
        height: 12px;
      }
    }

    /*
     * Last, so they win over the size rules above: the display as far from the cheeks as from the
     * name strip (landscape: from the controls and the bottom too, all round)
     */
    .display-section {
