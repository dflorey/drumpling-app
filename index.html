<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Drumpling FS-5: a vintage-style drum machine from the FS family." />
    <meta name="theme-color" content="#24211d" />
    <title>Drumpling FS-5</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff2a14'/%3E%3C/svg%3E" />
    <!-- Installable app: manifest for Android/Chrome, meta tags and touch icon for iOS home screens -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Drumpling" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <script>
      // On its own (not embedded in another page) the page gets a solid backdrop; embedded, it
      // stays transparent so the host page shows around the device.
      if (window.self === window.top) document.documentElement.classList.add('solo');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        /* Keep clear of notches, rounded corners and the home indicator. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: transparent;
      }
      /* Phones in portrait and short screens (phones held sideways): every pixel of height counts. */
      @media (max-width: 720px) and (orientation: portrait) {
        body {
          padding-top: max(6px, env(safe-area-inset-top));
          padding-bottom: max(6px, env(safe-area-inset-bottom));
        }
      }
      /* Small screens: the device nearly full width */
      @media (max-width: 720px) {
        body {
          padding-left: max(4px, env(safe-area-inset-left));
          padding-right: max(4px, env(safe-area-inset-right));
        }
      }
      @media (max-height: 520px) {
        body {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
      }
      /*
       * Installed as an app there is no host page behind it, so give it a dark backdrop. The app
       * scales itself to fit the window, so the page never needs to scroll: no scrollbars at all.
       */
      @media (display-mode: standalone) {
        html {
          background: #24211d;
          overflow: hidden;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /* Phones and landscape windows scroll instead of scaling the device down (see fit()) */
      @media (display-mode: standalone) and (max-width: 720px), (display-mode: standalone) and (orientation: landscape) {
        html {
          overflow: auto;
        }
      }
      /*
       * On its own page the device sits on a solid warm charcoal, a little lighter than the panel
       * so the case's drop shadow still reads, and matching the theme colour.
       */
      html.solo {
        min-height: 100%;
        background: #24211d;
      }
      drumpling-app:not(:defined) {
        display: none;
      }
    </style>

      transform: rotate(var(--angle, 20deg));
    }
    .screw::after {
      transform: rotate(calc(var(--angle, 20deg) + 90deg));
    }
    .screw.tl {
      top: 9px;
      left: 9px;
      --angle: 20deg;
    }
    .screw.tr {
      top: 9px;
      right: 9px;
      --angle: 65deg;
    }
    .screw.bl {
      bottom: 9px;
      left: 9px;
      --angle: 40deg;
    }
    .screw.br {
      bottom: 9px;
      right: 9px;
      --angle: 5deg;
    }

    /* Brushed aluminium name strip; the brand's size is shared with the badge, help key and tip button */
    header {
      --brand-size: clamp(1.3rem, 4vw, 1.85rem);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.95rem 2.4rem 0.85rem;
      color: #26251f;
      background:
        var(--brushed),
        linear-gradient(90deg, #9d9d97 0%, #d9d9d3 22%, #b5b5af 45%, #e4e4de 68%, #c2c2bc 85%, #9a9a94 100%);
      background-size: 600px 120px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 0 rgba(0, 0, 0, 0.35),
        0 2px 3px rgba(0, 0, 0, 0.55);
    }
    .brand {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.7rem;
      font-size: var(--brand-size);
    }
    /* Laser-etched into the aluminium, as on the other FS devices */
    .logo {
      flex: none;
      width: 1.3em;
      height: 1.3em;
      margin-right: -0.15rem;
      color: rgba(28, 25, 20, 0.78);
      filter: drop-shadow(0 0 0.8px rgba(40, 30, 20, 0.45)) drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    /* The p and g reach below the baseline: the svg doesn't clip them */
    .wordmark {
      flex: none;
      height: 1.25em;
      width: auto;
      aspect-ratio: 270 / 44;
      overflow: visible;
      filter: drop-shadow(0 0 0.8px rgba(40, 30, 20, 0.45)) drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    .wordmark .ink {
      stroke: rgba(28, 25, 20, 0.8);
    }
    .wordmark .inline {
      stroke: rgba(225, 225, 218, 0.7);
    }
    /*
     * Right of the strip: the help key, then the FS-5 badge. When the strip is too narrow for
     * both, the badge wraps onto a clipped second row and disappears.
     */
    .badges {
      --row: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 1rem 0.7rem;
      min-width: 0;
      height: var(--row);
      padding: 4px;
      margin: -4px;
      overflow: hidden;
      font-size: var(--brand-size);
    }
    .model {
      flex: none;
      white-space: nowrap;
      padding: 0.12rem 0.5rem 0.1rem;
      font-size: 0.68em;
      line-height: 1.39;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #f3ecd8;
      text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.35);
      background: linear-gradient(180deg, #d24a35, #a8301f);
      border-radius: 3px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 -1px 0 rgba(0, 0, 0, 0.3),
        0 1px 0 rgba(255, 255, 255, 0.5);
    }
    /* Help: a round key of brushed aluminium with an etched "?", as tall as the badge */
    .help {
      flex: none;
      display: grid;
      place-items: center;
      width: var(--row);
      height: var(--row);
      border-radius: 50%;
      font: 800 0.62em/1 var(--label-font);
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      background:
        var(--brushed),
        radial-gradient(circle at 40% 30%, #f6f6f1 0%, #d6d6d0 50%, #b2b2ac 100%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 2px 3px rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
    }
    .help:hover {
      filter: brightness(1.06);
    }
    .help:active {
      transform: translateY(1px);
    }
    .help:focus-visible,
    .tip-button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }
    /* Tip button between the name and the badges, a key of brushed aluminium */
    .tip-button {
      display: flex;
      flex: none;
      align-items: center;
      gap: 0.45rem;
      height: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      padding: 0 0.85rem 0 0.7rem;
      box-sizing: border-box;
      white-space: nowrap;
      font-family: var(--label-font);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      border-radius: 5px;
      background:
        var(--brushed),
        linear-gradient(180deg, #f6f6f1 0%, #d6d6d0 48%, #c0c0ba 52%, #b2b2ac 100%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 3px 4px rgba(0, 0, 0, 0.45);
    }
    .tip-icon {
      flex: none;
      width: 1.5em;
      height: 1.5em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (max-width: ${Mt-1}px) {
      .tip-button {
        display: none;
      }
    }
    @media (min-width: ${Mt}px) {
      .tip {
        display: none;
      }
    }
    .tip {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      color: #8c8577;
    }
    .tip a {
      color: #e0533d;
      font-weight: 700;
      text-decoration: none;
    }

    /* Silkscreened panel text */
    .label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      opacity: 0.92;
      text-shadow: 0 0 0.6px rgba(232, 225, 204, 0.6);
    }

    /* Display and controls: stacked, except side by side on short landscape screens */
    .panels {
      display: contents;
    }
    /* A size container: the rows' layouts follow the panel's own width */
    .controls-panel {
      --knob: 56px;
      /* The rows' side padding (the control row's; the effects' margin and padding add up to it) */
      --pad-x: 2.4rem;
      display: flex;
      flex-direction: column;
      container: controls / inline-size;
    }
    .display-section {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: calc(1.9rem + 5px) calc(2.4rem + 5px) 5px;
    }
    /* A backlit LCD behind glass, as on the Vibralizer FS-4 */
    .glass {
      --lcd-ink: #1b2620;
      --lcd-bg: #c8d1b6;
      position: relative;
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: var(--min-display, ${$s}px);
      border-radius: 4px;
      background:
        var(--grain),
        radial-gradient(ellipse at 50% 40%, #d6dfc6 0%, #c3ccb1 55%, #a7b294 100%);
      background-size: 180px 180px, auto;
      box-shadow:
        inset 0 3px 12px rgba(0, 0, 0, 0.75),
        inset 0 0 0 1px rgba(0, 0, 0, 0.8),
        0 0 0 4px #141412,
        0 0 0 5px #050505,
        0 -1px 0 5px rgba(0, 0, 0, 0.5),
        0 1px 0 5px rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }
    .glass::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(170deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.04) 34%, transparent 34.5%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), transparent 18%);
      pointer-events: none;
    }
    groove-display {
      flex: 1;
      min-height: 0;
    }

    /* Plastic keycaps seated in dark panel cut-outs */
    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .key {
      --cap-top: #f2ead4;
      --cap-mid: #e2d8bf;
      --cap-low: #c6bb9f;
      position: relative;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background:
        var(--grain),
        linear-gradient(180deg, var(--cap-top) 0%, var(--cap-mid) 55%, var(--cap-low) 100%);
      background-size: 120px 120px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        inset 0 -5px 0 rgba(0, 0, 0, 0.16),
        inset 0 -6px 3px rgba(0, 0, 0, 0.08),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 5px 7px 1px rgba(0, 0, 0, 0.55);
      transition:
        transform 0.05s,
        box-shadow 0.05s;
    }
    .key::before {
      content: '';
      position: absolute;
      inset: 5px 5px 9px;
      border-radius: 3px;
      background: radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.35), transparent 70%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }
    .key:disabled {
      cursor: default;
    }
    .key:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -3px 0 rgba(0, 0, 0, 0.16),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 2px 3px rgba(0, 0, 0, 0.6);
    }
    /* TR-808 cap colours: orange fills, a yellow half-time key */
    .key.fill {
      --cap-top: #f6a463;
      --cap-mid: #ec8a3e;
      --cap-low: #c46a26;
    }
    .key.half {
      --cap-top: #f8dc78;
      --cap-mid: #ecc449;
      --cap-low: #c89f2d;
    }
    /* The fill's number moulded into the cap, under its LED */
    .cap-number {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 9px;
      font-size: 0.8rem;
      font-weight: 800;
      color: rgba(60, 30, 8, 0.6);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }
    .key .key-led {
      position: absolute;
      top: 9px;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #6e2016, #360b06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.35),
        0 1px 0 1.5px rgba(255, 255, 255, 0.35);
      z-index: 1;
    }
    .key .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #ffb39f, #ff3a1c 55%, #c01a06);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(255, 58, 28, 0.6);
    }
    /* A fill waiting for the next bar: its LED blinks */
    .key .key-led.waiting {
      animation: waiting 0.25s steps(1) infinite;
    }
    @keyframes waiting {
      50% {
        background:
          radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
          radial-gradient(circle at 50% 50%, #6e2016, #360b06);
        box-shadow:
          0 0 0 1.5px rgba(0, 0, 0, 0.35),
          0 1px 0 1.5px rgba(255, 255, 255, 0.35);
      }
    }
    /* The style keys' LEDs are green, as the Vibralizer's instrument keys */
    .style .key-led {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #1d5a2a, #0b2812);
    }
    .style .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(circle at 50% 50%, #c6ffd2, #3ef06a 55%, #129c3a);
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px rgba(62, 240, 106, 0.55);
    }

    /*
     * Under the display, one row: Start / Stop, the three fills, half-time, the tempo display with
     * its Tap key, and the Swing and Volume knobs, their names on the line below.
     */
    .controls {
      --row-h: 56px;
      --knob-size: var(--knob);
      --digit-size: 2.1rem;
      --display-padding: 0.45rem 0.9rem;
      --display-reserve: 3.6rem;
      display: grid;
      /* The fills and the ending a group, with a little room either side */
      grid-template-columns: auto 0.3rem auto auto auto 0.3rem auto minmax(0, 1fr) auto auto auto;
      grid-template-rows: var(--row-h) auto;
      grid-template-areas:
        'start . f1 f2 f3 . half tempo tap swing volume'
        'start-l . f1-l f2-l f3-l . half-l tempo-l tap-l swing-l volume-l';
      justify-items: center;
      gap: 0.75rem 0.5rem;
      padding: 1.7rem 2.4rem 1.4rem;
    }
    .controls .key {
      align-self: stretch;
    }
    .start {
      grid-area: start;
      width: 58px;
    }
    .fill {
      width: 44px;
    }
    .f1 {
      grid-area: f1;
    }
    .f2 {
      grid-area: f2;
    }
    .f3 {
      grid-area: f3;
    }
    .half {
      grid-area: half;
      width: 50px;
    }
    /*
     * The display's frame is drawn 5px outside its box, a key's outline 2px: 6px shorter than the
     * row, its outer edges line up with the Tap key's
     */
    .controls value-display {
      grid-area: tempo;
      justify-self: stretch;
      align-self: center;
      height: calc(var(--row-h) - 6px);
      /* Its frame is drawn outside its box: as much room to Tap as Half time has to the frame */
      margin-right: 8px;
      --segment-on: #f2a51c;
      --segment-off: rgba(242, 165, 28, 0.07);
      --segment-glow: rgba(242, 150, 20, 0.7);
      --glass-center: #33210a;
      --glass-mid: #170f04;
      --glass-edge: #0c0702;
      /* Just the number: the label says it is the tempo */
      --unit-display: none;
      --display-reserve: 1.8rem;
    }
    /* Tap in the grey of the Metronome FS-1's */
    .tap {
      grid-area: tap;
      width: 46px;
      --cap-top: #bdbab2;
      --cap-mid: #a19e96;
      --cap-low: #858279;
    }
    .controls .swing {
      grid-area: swing;
      align-self: center;
    }
    .controls .volume {
      grid-area: volume;
      align-self: center;
    }
    .start-l {
      grid-area: start-l;
      color: #e0533d;
    }
    .f1-l {
      grid-area: f1-l;
    }
    .f2-l {
      grid-area: f2-l;
    }
    .f3-l {
      grid-area: f3-l;
    }
    .half-l {
      grid-area: half-l;
    }
    .tempo-l {
      grid-area: tempo-l;
    }
    .tap-l {
      grid-area: tap-l;
    }
    .swing-l {
      grid-area: swing-l;
      width: calc(var(--knob) + 1rem);
    }
    .volume-l {
      grid-area: volume-l;
      width: calc(var(--knob) + 1rem);
    }

    /*
     * The effects, on a plate of their own: flat paint, as the TR-808's panel, in a muted blue,
     * with rounded corners. Punch and Gated switch on and off, Scratch and Stutter act while held; the
     * knobs on the right, Reverb under Volume (the plate's margin and padding add up to the control
     * row's padding).
     */
    .effects {
      --fx-h: 52px;
      --knob-size: var(--knob);
      display: grid;
      grid-template-columns: auto auto auto auto minmax(0.5rem, 1fr) auto auto auto auto;
      grid-template-rows: var(--fx-h) auto;
      grid-template-areas:
        'punch gated scratch stutter . comp filter delay reverb'
        'punch-l gated-l scratch-l stutter-l . comp-l filter-l delay-l reverb-l';
      justify-items: center;
      gap: 0.6rem 1rem;
      margin: 0.2rem 1.6rem 1rem;
      padding: 1rem 0.8rem 0.9rem;
      border-radius: 6px;
      background: #4c5d6e;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }
    .fx-key {
      width: 56px;
      height: var(--fx-h);
    }
    .effects value-knob {
      align-self: center;
    }
    .stutter {
      grid-area: stutter;
    }
    .punch {
      grid-area: punch;
    }
    .gated {
      grid-area: gated;
    }
    .scratch {
      grid-area: scratch;
    }
    .comp {
      grid-area: comp;
    }
    .filter {
      grid-area: filter;
    }
    .delay {
      grid-area: delay;
    }
    .reverb {
      grid-area: reverb;
    }
    .stutter-l {
      grid-area: stutter-l;
    }
    .punch-l {
      grid-area: punch-l;
    }
    .gated-l {
      grid-area: gated-l;
    }
    .scratch-l {
      grid-area: scratch-l;
    }
    .comp-l,
    .filter-l,
    .delay-l,
    .reverb-l {
      width: calc(var(--knob) + 1rem);
    }
    .comp-l {
      grid-area: comp-l;
    }
    .filter-l {
      grid-area: filter-l;
    }
    .delay-l {
      grid-area: delay-l;
    }
    .reverb-l {
      grid-area: reverb-l;
    }

    /*
     * The machine row, as the Vibralizer's recordings row: its name above, then the slider and the
     * readout with the machine's name (narrow: the slider has the room)
     */
    .machines {
      --transport-key: 40px;
      display: grid;
      grid-template-columns: minmax(110px, 2.75fr) minmax(185px, 1fr);
      grid-template-areas:
        'title title'
        'slider readout';
      align-items: center;
      gap: 0.45rem 1.2rem;
      padding: 1.1rem 2.4rem 0.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    .machines .title,
    .complexity .title {
      margin-bottom: 0.5rem;
    }
    .machines .title {
      grid-area: title;
      justify-self: start;
    }
    .machines step-slider {
      grid-area: slider;
      /* Its slot level with the readout's middle */
      transform: translateY(-8px);
    }
    .readout {
      grid-area: readout;
      display: flex;
      align-items: center;
      min-width: 0;
      height: var(--transport-key);
      padding: 0 0.9rem;
      box-sizing: border-box;
      font: 700 1rem/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #ffb347;
      text-shadow: 0 0 6px rgba(255, 150, 50, 0.65);
      border-radius: 3px;
      background: #0a0b0a;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.95),
        0 0 0 2px #141412,
        0 0 0 3px #050505,
        0 1px 0 3px rgba(255, 255, 255, 0.08);
    }
    .readout span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    /* Complexity: a slider with the level's name beside it, above the style keys */
    .complexity {
      display: grid;
      grid-template-columns: minmax(110px, 2.75fr) minmax(185px, 1fr);
      grid-template-areas:
        'title title'
        'slider readout';
      align-items: center;
      gap: 0.45rem 1.2rem;
      padding: 0.7rem 2.4rem 0.3rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.12));
    }
    .complexity .title {
      grid-area: title;
      justify-self: start;
    }
    .complexity step-slider {
      grid-area: slider;
      transform: translateY(-8px);
    }
    .complexity .readout {
      --transport-key: 40px;
    }

    /* The style keys, each with its name under it (narrow panels: two rows of four) */
    .styles {
      display: grid;
      grid-template-columns: repeat(${H.length}, minmax(0, 1fr));
      gap: 0.9rem 1.2rem;
      padding: 1.1rem 2.4rem 1.5rem;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    .style-cell {
      display: grid;
      gap: 0.6rem;
      min-width: 0;
    }
    .style {
      height: 60px;
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
